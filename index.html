const map = L.map('map', { zoomControl: true }).setView([23.36, 116.70], 14);
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
  subdomains: ['1','2','3','4'], maxZoom: 18, attribution: '&copy; 高德地图'
}).addTo(map);

function createIcon(color, emoji, isMustEat) {
  const border = isMustEat ? '4px solid #ff4757' : '3px solid #fff';
  const shadow = isMustEat ? '0 0 12px rgba(255,71,87,0.6)' : '0 2px 8px rgba(0,0,0,0.3)';
  return L.divIcon({
    className: '',
    html: `<div style="background:${color};width:${isMustEat?36:30}px;height:${isMustEat?36:30}px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:${isMustEat?16:14}px;border:${border};box-shadow:${shadow}">${emoji}</div>`,
    iconSize: [isMustEat?36:30, isMustEat?36:30], iconAnchor: [isMustEat?18:15, isMustEat?18:15], popupAnchor: [0, -isMustEat?18:-15]
  });
}

let currentMarkers = [];
let currentPolyline = null;

function renderRoute(dayIdx, routeIdx) {
  currentMarkers.forEach(m => map.removeLayer(m));
  currentMarkers = [];
  if (currentPolyline) { map.removeLayer(currentPolyline); currentPolyline = null; }

  const route = routes[dayIdx][routeIdx];
  const container = document.getElementById('route' + dayIdx + '-content');

  let html = `<div class="day-banner" style="background:linear-gradient(135deg,#6c5ce7,#a29bfe)">
    <h3>📍 Day ${dayIdx+1} · 路线 ${String.fromCharCode(65+routeIdx)}</h3>
    <p>${route.length}个点位 · 点击任意点位地图自动定位</p>
  </div>`;

  html += '<div class="timeline">';
  const latlngs = [];

  route.forEach((p, idx) => {
    let data, type, name, desc, lng, lat, recommend, color, isMustEat = false;

    if (p.food && FOODS[p.food]) {
      data = FOODS[p.food];
      type = 'food';
      name = data.name;
      desc = data.desc + ' · 人均¥' + data.cost + ' · ' + data.rating + '分';
      lng = data.lng; lat = data.lat;
      recommend = data.recommend;
      color = '#00b894';
      isMustEat = MUST_EAT.includes(p.food);
    } else if (p.spot && SPOTS[p.spot]) {
      data = SPOTS[p.spot];
      type = data.type;
      name = data.name;
      desc = data.desc;
      lng = data.lng; lat = data.lat;
      recommend = data.recommend;
      color = type === 'hotel' ? '#e17055' : type === 'transport' ? '#a29bfe' : type === 'party' ? '#fd79a8' : '#0984e3';
    } else { return; }

    latlngs.push([lat, lng]);

    const icon = createIcon(
      color,
      type === 'food' ? '🍜' : type === 'hotel' ? '🏨' : type === 'transport' ? '🚄' : type === 'party' ? '🎉' : '📍',
      isMustEat
    );

    const marker = L.marker([lat, lng], { icon: icon }).addTo(map);

    const headerColors = {
      hotel: 'linear-gradient(135deg,#e17055,#d63031)',
      food: 'linear-gradient(135deg,#00b894,#00897b)',
      spot: 'linear-gradient(135deg,#0984e3,#0566d6)',
      transport: 'linear-gradient(135deg,#a29bfe,#6c5ce7)',
      party: 'linear-gradient(135deg,#fd79a8,#e84393)',
    };

    const mustEatBadge = isMustEat ? '<span class="must-eat-badge">必吃</span>' : '';

    marker.bindPopup(`
      <div class="popup-header" style="background:${headerColors[type]}">
        <h4>${name} ${mustEatBadge}</h4>
        <div class="time-badge">${p.time}</div>
      </div>
      <div class="popup-body">
        <div class="row"><b>📍 地址</b>${desc}</div>
        <div class="recommend">💡 ${recommend}</div>
      </div>
      <div class="popup-footer">
        <a href="https://uri.amap.com/marker?position=${lng},${lat}&name=${encodeURIComponent(name)}&callnative=1" target="_blank">
          在高德APP导航 →
        </a>
      </div>
    `, { maxWidth: 320 });

    currentMarkers.push(marker);

    html += `
      <div class="time-item ${type}" data-idx="${idx}">
        <span class="time">${p.time}</span>
        <div class="title">${name} ${mustEatBadge}</div>
        <div class="desc">${p.note || ''}</div>
        <div class="tags">
          <span class="tag" style="background:${color}">${type === 'food' ? '美食' : type === 'hotel' ? '住宿' : type === 'transport' ? '交通' : type === 'party' ? '庆生' : '景点'}</span>
        </div>
      </div>
    `;
  });

  html += '</div>';
  container.innerHTML = html;

  if (latlngs.length > 1) {
    currentPolyline = L.polyline(latlngs, {
      color: '#6c5ce7', weight: 3, opacity: 0.6, dashArray: '8, 8',
    }).addTo(map);
  }

  container.querySelectorAll('.time-item').forEach(item => {
    item.onclick = () => {
      const idx = parseInt(item.dataset.idx);
      const p = route[idx];
      let data;
      if (p.food && FOODS[p.food]) data = { ...FOODS[p.food] };
      else if (p.spot && SPOTS[p.spot]) data = { ...SPOTS[p.spot] };
      if (data) {
        map.setView([data.lat, data.lng], 16);
        currentMarkers[idx].openPopup();
      }
    };
  });

  if (currentMarkers.length > 0) {
    const group = L.featureGroup(currentMarkers);
    map.fitBounds(group.getBounds(), { padding: [50, 50] });
  }
}

let currentDay = 0;
let currentRoute = [0, 0, 0, 0];

document.querySelectorAll('.day-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.day-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    currentDay = parseInt(tab.dataset.day);
    document.getElementById('day' + currentDay).classList.add('active');
    renderRoute(currentDay, currentRoute[currentDay]);
  };
});

document.querySelectorAll('.route-tab').forEach(tab => {
  tab.onclick = () => {
    const dayContent = tab.closest('.day-content');
    dayContent.querySelectorAll('.route-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentRoute[currentDay] = parseInt(tab.dataset.route);
    renderRoute(currentDay, currentRoute[currentDay]);
  };
});

renderRoute(0, 0);
